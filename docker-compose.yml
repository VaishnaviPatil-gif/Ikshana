services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: oilspill
      POSTGRES_USER: oilspill
      POSTGRES_PASSWORD: oilspill_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilspill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      DATABASE_URL: postgresql+asyncpg://oilspill:oilspill_dev@db:5432/oilspill
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: hackathon-oil-spill-secret-key-2024
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
